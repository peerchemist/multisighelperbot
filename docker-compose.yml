version: '3.8'

services:
  dart_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multisighelper
    environment:
      - TGBOTTOKEN=${TGBOTTOKEN}
      - REDEEMSCRIPT=${REDEEMSCRIPT}
    command: sh -c "timeout 28800 /home/helperbot/bin/multisighelper"
    restart: always
